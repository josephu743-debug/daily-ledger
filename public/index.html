<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Ledger</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#3A4FE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#EDF0F8; --surface:#FFFFFF; --ink:#18203D; --muted:#6A7391; --line:#D5DAEA;
  --accent:#3A4FE0; --accent-ink:#FFFFFF; --done:#10A38E; --empty:#E3E7F4; --danger:#C8443A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10152B; --surface:#1A2140; --ink:#E8EBFA; --muted:#99A2C6; --line:#2B3560;
    --accent:#7C8CFF; --accent-ink:#10152B; --done:#2DD4BC; --empty:#252D52; --danger:#FF7A6E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10152B; --surface:#1A2140; --ink:#E8EBFA; --muted:#99A2C6; --line:#2B3560;
  --accent:#7C8CFF; --accent-ink:#10152B; --done:#2DD4BC; --empty:#252D52; --danger:#FF7A6E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:2px 0 20px}
.tabs{display:flex;gap:6px;background:var(--empty);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 .95rem inherit;font-family:inherit;padding:10px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(24,32,61,.15)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.add{display:flex;gap:8px;margin-bottom:16px}
.add input{flex:1;min-width:0;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.add input[type=date]{flex:0 0 auto;width:9.5rem}
.add button{padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 .95rem inherit;font-family:inherit;cursor:pointer}
.habit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.habit-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.habit-name{font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.streak{font-weight:800;color:var(--done);white-space:nowrap}
.streak small{color:var(--muted);font-weight:400}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.day button{width:100%;aspect-ratio:1;max-width:48px;border-radius:50%;border:2px solid var(--line);background:var(--empty);cursor:pointer;color:var(--accent-ink);font-weight:800;font-size:1rem;padding:0}
.day button[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.day.today span{color:var(--ink);font-weight:800}
.day.today button{border-color:var(--accent)}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:.85rem;padding:6px 0 0;margin-top:6px}
.del:hover{color:var(--danger)}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--done);flex:0 0 auto;cursor:pointer}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.due{font-size:.8rem;color:var(--muted);white-space:nowrap}
.due.late{color:var(--danger);font-weight:600}
.task .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;padding:4px 6px}
.task .x:hover{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:14px}
.summary{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.add{flex-wrap:wrap}
.add input[name=v]{flex:1 1 100%}
.add input[type=date]{flex:1 1 8rem;width:auto}
.add select{flex:1 1 6rem;padding:12px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.add button{padding:12px 18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:.85rem;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap;font-weight:400}
.mhead{display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px;font-weight:600}
.mhead button{border:0;background:transparent;color:var(--accent);font:inherit;font-size:1.4rem;cursor:pointer;padding:0 12px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .dh{font-size:.7rem;color:var(--muted);text-align:center}
.month button{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--empty);color:var(--muted);font:inherit;font-size:.75rem;cursor:pointer;padding:0}
.month button[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--accent-ink);font-weight:800}
.month button.td{border-color:var(--accent)}
.month button:disabled{opacity:.35;cursor:default}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600}
.banner button{border:0;background:transparent;color:inherit;font:inherit;font-size:1.3rem;cursor:pointer}
.remind{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:20px;font-size:.9rem}
.remind input[type=time]{padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.remind small{flex-basis:100%;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.day button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<main>
  <h1>Daily Ledger</h1>
  <p class="sub" id="today"></p>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-habits" aria-selected="true" data-tab="habits">Habits</button>
    <button role="tab" id="tab-tasks" aria-selected="false" data-tab="tasks">Tasks</button>
  </div>
  <div id="banner"></div>
  <section id="view"></section>
</main>
<script>
(function(){
  var KEY="daily-ledger-v1";
  var CATS=["General","School","Work","Health","Money"];
  var state={habits:[],tasks:[],remind:{on:false,time:"20:00",last:""}}, tab="habits", cat="All", mode="week", mo=0;
  try{var raw=localStorage.getItem(KEY); if(raw){var p=JSON.parse(raw); if(p&&p.habits&&p.tasks) state=p;}}catch(e){}
  if(!state.remind) state.remind={on:false,time:"20:00",last:""};
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} syncServer();}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function key(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day;}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  var todayKey=key(new Date());
  document.getElementById("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

  function catSel(){return '<select name="c" aria-label="Category">'+CATS.map(function(c){return '<option>'+c+'</option>';}).join("")+'</select>';}
  function chips(){return '<div class="chips">'+["All"].concat(CATS).map(function(c){return '<button type="button" class="chip" data-act="cat" data-c="'+c+'" aria-pressed="'+(c===cat)+'">'+c+'</button>';}).join("")+'</div>';}
  function inCat(x){return cat==="All"||(x.cat||"General")===cat;}
  function monthGrid(h){
    var n=new Date(),f=new Date(n.getFullYear(),n.getMonth()+mo,1),dim=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();
    var s='<div class="mhead"><button type="button" data-act="mprev" aria-label="Previous month">‹</button><span>'+f.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</span><button type="button" data-act="mnext" aria-label="Next month">›</button></div><div class="month">';
    "SMTWTFS".split("").forEach(function(l){s+='<span class="dh">'+l+'</span>';});
    for(var i=0;i<f.getDay();i++) s+='<i></i>';
    for(var d=1;d<=dim;d++){var k=key(new Date(f.getFullYear(),f.getMonth(),d)),on=!!h.done[k];
      s+='<button type="button" data-act="toggle-day" data-id="'+h.id+'" data-day="'+k+'" aria-pressed="'+on+'"'+(k===todayKey?' class="td"':'')+(k>todayKey?' disabled':'')+'>'+d+'</button>';}
    return s+'</div>';
  }
  function remindBox(){var r=state.remind;return '<div class="remind"><label><input type="checkbox" data-act="remind-toggle"'+(r.on?' checked':'')+'> Daily reminder</label><input type="time" data-remind-time value="'+esc(r.time)+'" aria-label="Reminder time"><small>Sends a notification even when the app is closed. On iPhone, add the app to your Home Screen first.</small></div>';}
  function lastSeven(){
    var out=[],d=new Date();
    for(var i=6;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-i);out.push({k:key(x),l:x.toLocaleDateString(undefined,{weekday:"narrow"})});}
    return out;
  }
  function streak(h){
    var d=new Date(),n=0;
    if(!h.done[key(d)]) d.setDate(d.getDate()-1);
    while(h.done[key(d)]){n++;d.setDate(d.getDate()-1);}
    return n;
  }
  function renderHabits(){
    var days=lastSeven();
    var html='<form class="add" data-form="habit"><input name="v" placeholder="New habit, like “Read 20 pages”" maxlength="80" aria-label="New habit" required>'+catSel()+'<button type="submit">Add habit</button></form>'+chips()+'<div class="chips"><button type="button" class="chip" data-act="mode" data-m="week" aria-pressed="'+(mode==="week")+'">Week</button><button type="button" class="chip" data-act="mode" data-m="month" aria-pressed="'+(mode==="month")+'">Month</button></div>';
    var hs=state.habits.filter(inCat);
    if(!hs.length){html+='<div class="empty">'+(state.habits.length?"No habits in this category.":"No habits yet. Add one above, then tap a circle each day you do it.")+'</div>';return html;}
    hs.forEach(function(h){
      var s=streak(h);
      html+='<div class="habit"><div class="habit-top"><span class="habit-name">'+esc(h.name)+' <span class="tag">'+esc(h.cat||"General")+'</span></span><span class="streak">'+s+' <small>day'+(s===1?"":"s")+' in a row</small></span></div><div class="week">';
      (mode==="week"?days:[]).forEach(function(d){
        var on=!!h.done[d.k];
        html+='<div class="day'+(d.k===todayKey?" today":"")+'"><button type="button" data-act="toggle-day" data-id="'+h.id+'" data-day="'+d.k+'" aria-pressed="'+on+'" aria-label="'+esc(h.name)+' on '+d.k+'">'+(on?"✓":"")+'</button><span>'+d.l+'</span></div>';
      });
      html+='</div>'+(mode==="month"?monthGrid(h):"")+'<button class="del" data-act="del-habit" data-id="'+h.id+'">Delete habit</button></div>';
    });
    return html;
  }
  function renderTasks(){
    var html='<form class="add" data-form="task"><input name="v" placeholder="New task" maxlength="120" aria-label="New task" required>'+catSel()+'<input type="date" name="due" aria-label="Due date"><button type="submit">Add</button></form>'+chips();
    if(!state.tasks.length){return html+'<div class="empty">No tasks yet. Add one above. A due date is optional.</div>';}
    var open=state.tasks.filter(function(t){return !t.done&&inCat(t);});
    var done=state.tasks.filter(function(t){return t.done&&inCat(t);});
    open.sort(function(a,b){return (a.due||"9999")<(b.due||"9999")?-1:1;});
    html+='<p class="summary">'+open.length+' open, '+done.length+' done</p>';
    open.concat(done).forEach(function(t){
      var late=t.due&&!t.done&&t.due<todayKey;
      html+='<div class="task'+(t.done?" done":"")+'"><input type="checkbox" data-act="toggle-task" data-id="'+t.id+'"'+(t.done?" checked":"")+' aria-label="Mark done"><span class="t">'+esc(t.text)+'</span><span class="tag">'+esc(t.cat||"General")+'</span>'+(t.due?'<span class="due'+(late?" late":"")+'">'+(late?"Overdue · ":"")+esc(t.due)+'</span>':"")+'<button class="x" data-act="del-task" data-id="'+t.id+'" aria-label="Delete task">×</button></div>';
    });
    if(done.length) html+='<button class="del" data-act="clear-done">Clear completed</button>';
    return html;
  }
  function render(){
    document.getElementById("view").innerHTML=(tab==="habits"?renderHabits():renderTasks())+remindBox();
    ["habits","tasks"].forEach(function(t){document.getElementById("tab-"+t).setAttribute("aria-selected",String(t===tab));});
  }
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function(){});
  function urlB64(s){var p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;}
  function getSub(){return navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.getSubscription();});}
  var syncT=null;
  function syncServer(){
    if(!state.remind.on||!("serviceWorker" in navigator)) return;
    clearTimeout(syncT);
    syncT=setTimeout(function(){
      getSub().then(function(sub){
        if(!sub) return;
        return fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({subscription:sub.toJSON(),time:state.remind.time,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,habits:state.habits.map(function(h){return {name:h.name,done:h.done};}),tasks:state.tasks.map(function(t){return {done:t.done,due:t.due};})})});
      }).catch(function(){});
    },800);
  }
  function togglePush(on){
    if(!on){
      state.remind.on=false;save();render();
      getSub().then(function(sub){if(!sub) return; fetch("/api/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({endpoint:sub.endpoint})}); return sub.unsubscribe();}).catch(function(){});
      return;
    }
    if(!("serviceWorker" in navigator)||!("PushManager" in window)||!window.Notification){alert("This browser can’t send push notifications. On iPhone, add the app to your Home Screen first.");render();return;}
    Notification.requestPermission().then(function(p){
      if(p!=="granted") throw new Error("denied");
      return fetch("/api/key").then(function(r){return r.json();});
    }).then(function(k){
      return navigator.serviceWorker.ready.then(function(reg){return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(k.key)});});
    }).then(function(){state.remind.on=true;state.remind.last="";save();render();})
    .catch(function(){alert("Couldn’t turn on notifications. Check that they’re allowed for this site.");render();});
  }
  var banner=document.getElementById("banner");
  function checkRemind(){
    var r=state.remind; if(!r.on) return;
    var n=new Date(),hm=(n.getHours()<10?"0":"")+n.getHours()+":"+(n.getMinutes()<10?"0":"")+n.getMinutes();
    if(hm<r.time||r.last===todayKey) return;
    var pend=state.habits.filter(function(h){return !h.done[todayKey];}).length;
    var late=state.tasks.filter(function(t){return !t.done&&t.due&&t.due<todayKey;}).length;
    r.last=todayKey; save();
    if(!pend&&!late) return;
    var msg=(pend?pend+" habit"+(pend===1?"":"s")+" left today":"")+(pend&&late?", ":"")+(late?late+" overdue task"+(late===1?"":"s"):"");
    banner.innerHTML='<div class="banner" role="status"><span>'+msg+'</span><button type="button" aria-label="Dismiss" data-dismiss>×</button></div>';
    
  }
  banner.addEventListener("click",function(e){if(e.target.closest("[data-dismiss]")) banner.innerHTML="";});
  document.getElementById("view").addEventListener("change",function(e){if(e.target.hasAttribute("data-remind-time")){state.remind.time=e.target.value||"20:00";state.remind.last="";save();}});
  setInterval(checkRemind,30000); checkRemind();
  document.querySelector(".tabs").addEventListener("click",function(e){
    var b=e.target.closest("[data-tab]"); if(!b) return; tab=b.getAttribute("data-tab"); render();
  });
  var view=document.getElementById("view");
  view.addEventListener("submit",function(e){
    e.preventDefault();
    var f=e.target, v=f.elements.v.value.trim(); if(!v) return;
    if(f.getAttribute("data-form")==="habit") state.habits.push({id:uid(),name:v,cat:f.elements.c.value,done:{}});
    else state.tasks.push({id:uid(),text:v,cat:f.elements.c.value,done:false,due:f.elements.due.value||""});
    save(); render();
  });
  view.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]"); if(!b) return;
    var act=b.getAttribute("data-act"), id=b.getAttribute("data-id");
    if(act==="cat"){cat=b.getAttribute("data-c");render();return;}
    if(act==="mode"){mode=b.getAttribute("data-m");render();return;}
    if(act==="mprev"){mo--;render();return;}
    if(act==="mnext"){if(mo<0)mo++;render();return;}
    if(act==="remind-toggle"){togglePush(b.checked);return;}
    if(act==="toggle-day"){
      var h=state.habits.filter(function(x){return x.id===id;})[0], d=b.getAttribute("data-day");
      if(h){ if(h.done[d]) delete h.done[d]; else h.done[d]=true; }
    } else if(act==="del-habit"){
      if(!confirm("Delete this habit and its history?")) return;
      state.habits=state.habits.filter(function(x){return x.id!==id;});
    } else if(act==="toggle-task"){
      state.tasks.forEach(function(t){if(t.id===id) t.done=!t.done;});
    } else if(act==="del-task"){
      state.tasks=state.tasks.filter(function(x){return x.id!==id;});
    } else if(act==="clear-done"){
      state.tasks=state.tasks.filter(function(x){return !x.done;});
    }
    save(); render();
  });
  render();
})();
</script>
</body>
</html>
